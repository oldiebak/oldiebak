<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="oldiebak">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.18" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.88" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 40" fill="none" stroke="#182232" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="1000" height="4" patternUnits="userSpaceOnUse">
      <rect width="1000" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowC" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#glowG)"/>
  <rect width="1000" height="240" fill="url(#glowC)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <rect width="1000" height="240" fill="url(#scan)"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#00ff9c" stroke-width="2" opacity="0.9">
    <path d="M28 30 H64 V66"/>
    <path d="M972 30 H936 V66"/>
    <path d="M28 210 H64 V174"/>
    <path d="M972 210 H936 V174"/>
  </g>

  <!-- neon accents -->
  <rect x="0" y="120" width="6" height="1" fill="#00ff9c" opacity="0.6"/>
  <rect x="0" y="124" width="120" height="1" fill="#00e5ff" opacity="0.4"/>

  <!-- title -->
  <text x="70" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="66" font-weight="700" letter-spacing="5" fill="#00ff9c" filter="url(#glowG)">OLDIBAK</text>

  <!-- terminal line -->
  <text x="72" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#8b949e">root@oldiebak:~$ <tspan fill="#00e5ff">▮</tspan></text>
</svg>
